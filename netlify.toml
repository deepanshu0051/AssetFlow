[build]
  command = "npm run build-all"
  publish = "frontend/dist"
  functions = "backend/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "mongoose", "bcryptjs", "jsonwebtoken", "dotenv", "cors", "helmet", "express-rate-limit", "express-mongo-sanitize", "express-validator", "nodemailer", "winston"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
